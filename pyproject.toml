[project]
name = "arjan_codes_sw_design_mindset"
version = "0.0.1"

authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
description = "A python package template"
readme = "README.md"


requires-python = ">=3.10"
dependencies = ["numpy>=1.2,<=1.26.1", "strenum>=0.4.15,<=0.4.15"]
[project.optional-dependencies]
test = [
  "check-manifest>=0.49,<=0.49",
  "pre-commit>=3.3.3,<=3.5.0",
  "pytest-cov>=4.1,<=4.1",
  "pytest-mock>=3.10,<=3.12.0",
  "pytest-runner>=6.0,<=6.0",
  "pytest>=7.4,<=7.4.3",
  "hypothesis>=6.82,<=6.88.1",
  "ruff>=0.0.280,<=0.1.3",
  "coverage>=7.2.7,<=7.3.2",
]

[project.urls]
Source = "https://github.com/blooop/arjan_codes_sw_design_mindset"
Home = "https://github.com/blooop/arjan_codes_sw_design_mindset"


[tool.flit.module]
name = "arjan_codes_sw_design_mindset"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"


[tool.ruff]
# Never enforce `E501` (line length violations).
#"F841" will auto remove unused variables which is annoying during development
ignore = ["E501", "E902", "F841"]
exclude = ["**/official/**"]


line-length = 100

target-version = "py310"

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]


[tool.coverage.run]
omit = ["*/test/*", "__init__.py"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if False:",
  "if 0:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# pixi supplies Python and the dev environment in the devcontainer
# (ghcr.io/blooop/python_template/devcontainer has no pip-based Python setup).
# The package build stays on flit, so CI and publishing do not change.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
arjan_codes_sw_design_mindset = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
